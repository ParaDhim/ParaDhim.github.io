- project: "MCP-SWE-Gym (Agent Evaluation Benchmark)"
  role: "AI Systems & Evaluation Engineer"
  url: "https://github.com/ParaDhim/mcp-swe-gym"
  duration: "2026"
  description: >
    Engineered an evaluation harness and benchmark environment assessing whether LLM agents can discover task requirements via Model Context Protocol (MCP) tools and implement verified code solutions. Built 4 deterministic task families (bugfix, feature, refactor, and latency-budgeted performance optimization) pairing Python codebases with a FastMCP server holding decisive domain context (issues, design docs, configs). Implemented a sandboxed verification pipeline (patch extraction, git apply, hidden test suites) verified with strict property gates: oracle agent (4/4 pass), null agent (0/4 pass), and 5 mutation testing suites. Benchmarked frontier and open-weight models (Groq gpt-oss-120b, Claude, Ollama) tracking multi-turn tool traces, recovering a 100% sweep pass rate across all tasks. <br/><strong>Tech:</strong> Python, Model Context Protocol (MCP), FastMCP, Pytest, Astral uv, Mypy (Strict), Ruff, Docker, LLM Benchmarking.

- project: "Industrial Steel Surface Defect Inspection Service"
  role: "ML Systems Engineer"
  url: "https://github.com/ParaDhim/neu-det-defect-inspection-service"
  duration: "2026"
  description: >
    Designed and deployed an end-to-end metallurgical defect-detection platform on the NEU-DET dataset (1,800 steel strip images, 6 defect classes). Ran an 11-run MLflow DOE selecting YOLOv8n 224px FP32 via validation mAP50, achieving 74.2% clean / 26.8% shifted test mAP50 at ~5.4 ms p95 on CPU (~190 FPS, 12 MB ONNX). Implemented per-class confidence overrides (crazing threshold 0.112 tuned on validation) boosting crazing recall from 11% to 43%. Benchmarked dynamic INT8 and static QDQ quantization (both slower than FP32 on this CPU, ruling them out). Built KS-test covariate drift monitoring with automated retraining trigger and a PatchCore unsupervised anomaly baseline (99.7% prototype AUROC). Wrapped the system in a FastAPI microservice with Prometheus metrics, Kubernetes manifests (HPA 2→8 replicas), and a deterministic metallurgical rule engine fallback running at 0.004 ms for air-gapped deployments. <br/><strong>Tech:</strong> Python, YOLOv8, ONNX Runtime, FastAPI, MLflow, PyTorch, Kubernetes, Docker, Prometheus.

